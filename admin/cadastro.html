<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar acesso — Painel DIDAS</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B0A12" />
  <link rel="icon" href="../assets/img/favicon.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <div class="auth-wrap">
    <main class="auth-card">
      <span class="brand"><img src="../assets/img/didas-logo.webp" alt="DIDAS" width="112" height="28" /></span>
      <h1>Criar acesso</h1>
      <p class="sub">Cadastro para a equipe gerenciar os leads do site.</p>

      <!-- Prévia visual. A criação real da conta e a regra de domínio entram no backend. -->
      <form action="login.html" method="get" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Seu nome" />
        </div>
        <div class="field">
          <label for="email">E-mail corporativo</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@terminal404.com.br" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password" placeholder="mínimo 8 caracteres" />
        </div>
        <div class="field">
          <label for="senha2">Confirmar senha</label>
          <input type="password" id="senha2" name="senha2" autocomplete="new-password" placeholder="repita a senha" />
        </div>
        <div class="auth-rule"><span>Só é possível criar conta com e-mail <code>@terminal404.com.br</code> — a regra é checada no servidor.</span></div>
        <button type="submit" class="btn btn-lg">Criar acesso</button>
      </form>

      <p class="auth-alt">Já tem conta? <a href="login.html">Entrar</a></p>
      <p class="auth-note">Prévia — cadastro ainda sem backend.</p>
    </main>
  </div>
</body>
</html>
